{% extends "layouts/base.html" %}

{% block content %}
<div id="usersAlert" class="alert alert-danger hidden mb-5" role="alert"></div>

<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between gap-3">
    <h3 class="card-title">
      <i class="ti ti-users me-2" style="color:var(--nc-primary);font-size:1.1rem;" aria-hidden="true"></i>
      User List
    </h3>
    <button class="btn btn-primary app-toolbar-add-btn" type="button" id="openCreateUserModal">
      <i class="ti ti-plus" aria-hidden="true"></i> Add User
    </button>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-row-dashed align-middle user-table mb-0">
        <thead>
          <tr>
            <th>No</th>
            <th>Username</th>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Created</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- User Modal -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="userModalTitle">Add User</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="userForm">
        <div class="modal-body">
          <input type="hidden" name="user_id" />
          <div class="row g-5">
            <div class="col-md-6">
              <label class="form-label required">Username</label>
              <input class="form-control" type="text" name="username" required />
            </div>
            <div class="col-md-6">
              <label class="form-label required">Full Name</label>
              <input class="form-control" type="text" name="full_name" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Role</label>
              <select class="form-select" name="is_admin">
                <option value="false">User</option>
                <option value="true">Admin</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Status</label>
              <select class="form-select" name="is_active">
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
            </div>
            <div class="col-12" id="userPasswordGroup">
              <label class="form-label required">Initial Password</label>
              <input class="form-control" type="password" name="password" minlength="6" placeholder="Minimum 6 characters" />
              <div class="form-text">Only required when creating a new user.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="userSubmitButton">
            <i class="ti ti-device-floppy me-1" aria-hidden="true"></i> Save User
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Password Modal -->
<div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">
          <i class="ti ti-key me-2" aria-hidden="true"></i> Set Password
        </h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="passwordForm">
        <div class="modal-body">
          <input type="hidden" name="user_id" />
          <div class="mb-5">
            <div class="form-label fw-semibold mb-2">Selected User</div>
            <div id="passwordTarget" class="app-selected-user">No user selected</div>
          </div>
          <div class="mb-4">
            <label class="form-label required">New Password</label>
            <input class="form-control" type="password" name="password" minlength="6" required placeholder="Minimum 6 characters" />
          </div>
          <div>
            <label class="form-label required">Confirm Password</label>
            <input class="form-control" type="password" name="confirm_password" minlength="6" required placeholder="Re-enter the new password" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-warning">
            <i class="ti ti-key me-1" aria-hidden="true"></i> Update Password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="/assets/js/users.js"></script>
{% endblock %}
